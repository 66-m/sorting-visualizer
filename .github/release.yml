# Groups GitHub's auto-generated release notes (used by .github/workflows/release.yml).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ['*']
